server:
  port: 8081

spring:
  application:
    name: qingteng-user-service
    admin:
      enabled: false
  jmx:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2000ms

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/qingteng?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
    username: root
    password: Ymc180203$$

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: info
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

